events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # -------------------------------------------------------------
        # 301 Permanent Redirects for Legacy WordPress URLs
        # -------------------------------------------------------------
        location = /circuito-uyo-uyo { return 301 /es/circuitos/circuito-uyo-uyo; }
        location = /circuito-uyo-uyo/ { return 301 /es/circuitos/circuito-uyo-uyo; }

        location = /pueblos-antiguos { return 301 /es/circuitos/pueblos-antiguos; }
        location = /pueblos-antiguos/ { return 301 /es/circuitos/pueblos-antiguos; }

        location = /mirador-achomani { return 301 /es/circuitos/mirador-achomani; }
        location = /mirador-achomani/ { return 301 /es/circuitos/mirador-achomani; }

        location = /mirador-kgoriwayra { return 301 /es/circuitos/mirador-kgoriwayra; }
        location = /mirador-kgoriwayra/ { return 301 /es/circuitos/mirador-kgoriwayra; }

        location = /aguas-termales { return 301 /es/circuitos/aguas-termales; }
        location = /aguas-termales/ { return 301 /es/circuitos/aguas-termales; }

        location = /origen-amazonas { return 301 /es/circuitos/origen-amazonas; }
        location = /origen-amazonas/ { return 301 /es/circuitos/origen-amazonas; }

        location = /tres-canones { return 301 /es/circuitos/tres-canones; }
        location = /tres-canones/ { return 301 /es/circuitos/tres-canones; }

        location = /sabancaya { return 301 /es/circuitos/sabancaya; }
        location = /sabancaya/ { return 301 /es/circuitos/sabancaya; }

        location = /fortaleza-chimpa { return 301 /es/circuitos/fortaleza-chimpa; }
        location = /fortaleza-chimpa/ { return 301 /es/circuitos/fortaleza-chimpa; }

        location = /parte-profunda-colca { return 301 /es/circuitos/parte-profunda-colca; }
        location = /parte-profunda-colca/ { return 301 /es/circuitos/parte-profunda-colca; }

        location = /circuito-tradicional { return 301 /es/circuitos/circuito-tradicional; }
        location = /circuito-tradicional/ { return 301 /es/circuitos/circuito-tradicional; }

        location = /geiser-pinchollo { return 301 /es/circuitos/geiser-pinchollo; }
        location = /geiser-pinchollo/ { return 301 /es/circuitos/geiser-pinchollo; }

        location = /nosotros { return 301 /es/nosotros; }
        location = /nosotros/ { return 301 /es/nosotros; }
        location = /nosotros.html { return 301 /es/nosotros; }

        location = /rutas { return 301 /es/circuitos; }
        location = /rutas/ { return 301 /es/circuitos; }
        location = /rutas.html { return 301 /es/circuitos; }

        location = /actividades-complementarias { return 301 /es/actividades; }
        location = /actividades-complementarias/ { return 301 /es/actividades; }
        location = /actividades-complementarias.html { return 301 /es/actividades; }

        location = /reservas { return 301 /es/reservar; }
        location = /reservas/ { return 301 /es/reservar; }

        location = /contacto-2 { return 301 /es/contacto; }
        location = /contacto-2/ { return 301 /es/contacto; }

        location = /blog { return 301 /es/blog; }
        location = /blog/ { return 301 /es/blog; }

        # Health check endpoint
        location /healthz {
            access_log off;
            return 200 "OK\n";
        }

        # Cache static assets
        location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|avif|woff2?|eot|ttf|svg)$ {
            expires 6M;
            access_log off;
            add_header Cache-Control "public, max-age=15552000, immutable";
        }

        # Angular Single Page Application fallback
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}

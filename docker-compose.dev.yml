services:
  mysql:
    image: mysql:8.0
    container_name: kgoriwayra_mysql_dev
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: dev_root_password
      MYSQL_DATABASE: kgoriwayra
      MYSQL_USER: kgoriwayra_dev
      MYSQL_PASSWORD: dev_password_123
    volumes:
      - mysql_dev_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pdev_root_password"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_dev_data:
    driver: local

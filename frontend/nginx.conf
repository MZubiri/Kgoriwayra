events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # -------------------------------------------------------------
        # 301 Permanent Redirects for Legacy WordPress URLs
        # -------------------------------------------------------------
        location = /circuito-uyo-uyo { return 301 /es/circuitos/circuito-uyo-uyo; }
        location = /circuito-uyo-uyo/ { return 301 /es/circuitos/circuito-uyo-uyo; }

        location = /pueblos-antiguos { return 301 /es/circuitos/pueblos-antiguos; }
        location = /pueblos-antiguos/ { return 301 /es/circuitos/pueblos-antiguos; }

        location = /mirador-achomani { return 301 /es/circuitos/mirador-achomani; }
        location = /mirador-achomani/ { return 301 /es/circuitos/mirador-achomani; }

        location = /mirador-kgoriwayra { return 301 /es/circuitos/mirador-kgoriwayra; }
        location = /mirador-kgoriwayra/ { return 301 /es/circuitos/mirador-kgoriwayra; }

        location = /aguas-termales { return 301 /es/circuitos/aguas-termales; }
        location = /aguas-termales/ { return 301 /es/circuitos/aguas-termales; }

        location = /origen-amazonas { return 301 /es/circuitos/origen-amazonas; }
        location = /origen-amazonas/ { return 301 /es/circuitos/origen-amazonas; }

        location = /tres-canones { return 301 /es/circuitos/tres-canones; }
        location = /tres-canones/ { return 301 /es/circuitos/tres-canones; }

        location = /sabancaya { return 301 /es/circuitos/sabancaya; }
        location = /sabancaya/ { return 301 /es/circuitos/sabancaya; }

        location = /fortaleza-chimpa { return 301 /es/circuitos/fortaleza-chimpa; }
        location = /fortaleza-chimpa/ { return 301 /es/circuitos/fortaleza-chimpa; }

        location = /parte-profunda-colca { return 301 /es/circuitos/parte-profunda-colca; }
        location = /parte-profunda-colca/ { return 301 /es/circuitos/parte-profunda-colca; }

        location = /circuito-tradicional { return 301 /es/circuitos/circuito-tradicional; }
        location = /circuito-tradicional/ { return 301 /es/circuitos/circuito-tradicional; }

        location = /geiser-pinchollo { return 301 /es/circuitos/geiser-pinchollo; }
        location = /geiser-pinchollo/ { return 301 /es/circuitos/geiser-pinchollo; }

        location = /nosotros { return 301 /es/nosotros; }
        location = /nosotros/ { return 301 /es/nosotros; }
        location = /nosotros.html { return 301 /es/nosotros; }

        location = /rutas { return 301 /es/circuitos; }
        location = /rutas/ { return 301 /es/circuitos; }
        location = /rutas.html { return 301 /es/circuitos; }

        location = /actividades-complementarias { return 301 /es/actividades; }
        location = /actividades-complementarias/ { return 301 /es/actividades; }
        location = /actividades-complementarias.html { return 301 /es/actividades; }

        location = /reservas { return 301 /es/reservar; }
        location = /reservas/ { return 301 /es/reservar; }

        location = /contacto-2 { return 301 /es/contacto; }
        location = /contacto-2/ { return 301 /es/contacto; }

        location = /blog { return 301 /es/blog; }
        location = /blog/ { return 301 /es/blog; }

        # Health check endpoint
        location /healthz {
            access_log off;
            return 200 "OK\n";
        }

        # Proxy backend API requests
        location /api/ {
            proxy_pass http://api:8080/api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Proxy backend uploads
        location /uploads/ {
            proxy_pass http://api:8080/uploads/;
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # Proxy Swagger documentation
        location /swagger/ {
            proxy_pass http://api:8080/swagger/;
            proxy_set_header Host $host;
        }

        # Cache static assets
        location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, no-transform, immutable";
        }

        # Cache JavaScript and CSS
        location ~* \.(css|js)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # HTML and Angular routing (SPA fallback)
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        error_page 404 /index.html;
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
